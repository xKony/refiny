name: Feature request
description: Suggest a capability or a change in behavior.
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is currently awkward or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Selection capture and replacement
        - Provider and prompt
        - Overlay and mascot
        - Configuration
        - Packaging and distribution
        - Documentation
        - Other
    validations:
      required: true
