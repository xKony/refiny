<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refiny</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body class="overlay-body">
    <div class="pill" id="pill" data-state="working" role="status" aria-live="polite">
      <svg
        class="mascot"
        viewBox="2 1 12 14"
        shape-rendering="crispEdges"
        aria-hidden="true"
        focusable="false"
      >
        <g class="mascot-body">
          <rect x="2" y="1" width="3" height="3" />
          <rect x="11" y="1" width="3" height="3" />
          <rect x="2" y="4" width="12" height="8" />
          <rect x="4" y="12" width="3" height="3" />
          <rect x="9" y="12" width="3" height="3" />
        </g>
        <g class="mascot-eye">
          <rect x="5" y="7" width="2" height="3" />
          <rect x="9" y="7" width="2" height="3" />
        </g>
        <rect class="mascot-mouth" x="7" y="11" width="2" height="1" />
      </svg>
      <span class="label" id="label">Polishing…</span>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
